# Local bench: `npm run db:up` still starts only postgres.
# Trial (API + UI in one container): `docker compose up --build`
# Identify/Flash stay on the USB machine. This stack is the console + kit webhooks.

services:
  postgres:
    image: postgres:16-alpine
    container_name: myhero-console-pg
    environment:
      POSTGRES_USER: myhero
      POSTGRES_PASSWORD: myhero
      POSTGRES_DB: myhero
    ports:
      - "5432:5432"
    volumes:
      - myhero-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhero -d myhero"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://myhero:myhero@postgres:5432/myhero}
      PORT: "3848"
      LISTEN_HOST: 0.0.0.0
      CLIENT_DIST: /app/client/dist
    ports:
      - "${TRIAL_PORT:-8080}:3848"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3848/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  myhero-pg:

# App only. Postgres is the existing Dokploy service — set DATABASE_URL.
# Trial: `docker compose up --build`
# Identify/Flash stay on the USB machine.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3848"
      LISTEN_HOST: 0.0.0.0
      CLIENT_DIST: /app/client/dist
    ports:
      - "3848:3848"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3848/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
